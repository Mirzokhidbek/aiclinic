name: clinic-ai

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://s3:8333
    SEED_DIR: /seed
  volumes:
    - models:/models
    - ./seed:/seed:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  s3:
    # S3-compatible object storage (MinIO images are no longer published on Docker Hub).
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - s3data:/data
    ports: ["8333:8333"]

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-only}
      SALT: ${LANGFUSE_SALT:-local-dev-only}
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot.polling"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
  models:
