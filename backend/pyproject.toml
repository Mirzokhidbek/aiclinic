[project]
name = "clinic-ai-backend"
version = "0.1.0"
description = "AI customer support platform: API, Telegram bot and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13",
    "alembic>=1.13",
    "anthropic>=1.0",
    "arq>=0.26",
    "asyncpg>=0.29",
    "cryptography>=43",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["arq.*", "fastembed.*", "pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
